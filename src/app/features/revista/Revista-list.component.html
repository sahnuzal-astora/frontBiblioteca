<div class="Revista-list">
  <div class="card">
    <div class="card-header">
      <h2>Gestión de Revistas</h2>
      <button class="btn btn-success" (click)="openCreateModal()">➕ Nueva Revista</button>
    </div>

    <div class="filters">
      <input
        type="text"
        placeholder="Buscar por ID"
        [(ngModel)]="filtroIdRevista"
        (input)="filtrarRevistas()"
      />
      <input
        type="text"
        placeholder="Buscar por edición"
        [(ngModel)]="filtroEdicion"
        (input)="filtrarRevistas()"
      />
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Edición</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let revista of revistasFiltradas">
          <td>{{ revista.id_revista }}</td>
          <td>{{ revista.edicion }}</td>
          <td>
            <button class="btn btn-warning btn-sm" (click)="openEditModal(revista)">✏️</button>
            <button class="btn btn-danger btn-sm" (click)="deleteRevista(revista.id_revista)">🗑️</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="modal-backdrop" *ngIf="showModal">
    <div class="modal-content animate">
      <h3>{{ isEditMode ? 'Editar Revista' : 'Nueva Revista' }}</h3>
      <form (ngSubmit)="saveRevista()">

        <div class="form-group">
          <label for="edicion">Edición</label>
          <input
            id="edicion"
            name="edicion"
            type="text"
            [(ngModel)]="revistaForm.edicion"
            required
          />
        </div>

        <ng-container *ngIf="isEditMode">
          <div class="form-group">
            <label for="id_usuario_edita">ID Usuario Edita (UUID)</label>
            <input
              id="id_usuario_edita"
              name="id_usuario_edita"
              type="text"
              [(ngModel)]="revistaForm.id_usuario_edita"
              required
            />
          </div>
        </ng-container>

        <ng-container *ngIf="!isEditMode">
          <div class="form-group">
            <label for="producto_id">Producto ID (UUID)</label>
            <input
              id="producto_id"
              name="producto_id"
              type="text"
              [(ngModel)]="revistaForm.producto_id"
              required
            />
          </div>
          <div class="form-group">
            <label for="id_usuario_crea">ID Usuario Crea (UUID)</label>
            <input
              id="id_usuario_crea"
              name="id_usuario_crea"
              type="text"
              [(ngModel)]="revistaForm.id_usuario_crea"
              required
            />
          </div>
        </ng-container>

        <div class="actions">
          <button type="submit" class="btn btn-primary">
            {{ isEditMode ? 'Actualizar' : 'Guardar' }}
          </button>
          <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>
