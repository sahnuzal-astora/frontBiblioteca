<div class="producto-list">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h2>Gestión de Productos</h2>
      <button class="btn btn-success" (click)="openCreateModal()">➕ Nuevo Producto</button>
    </div>

    <!-- 🔍 Filtro -->
    <div class="filter-bar mt-2">
      <input
        type="text"
        placeholder="Filtrar por título"
        [(ngModel)]="filtroTitulo"
        (input)="onFilterChange()"
        class="form-control"
      />
    </div>

    <!-- 📋 Tabla -->
    <table class="table table-striped mt-3">
      <thead>
        <tr>
          <th>ID</th>
          <th>Título</th>
          <th>Autor</th>
          <th>Año</th>
          <th>Disponible</th>
          <th>Acciones</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let producto of productosFiltrados">
          <td>{{ producto.id_producto }}</td>
          <td>{{ producto.titulo }}</td>
          <td>{{ producto.autor }}</td>
          <td>{{ producto.anio }}</td>
          <td>
            <span [class.text-success]="producto.disponible" [class.text-danger]="!producto.disponible">
              {{ producto.disponible ? 'Sí' : 'No' }}
            </span>
          </td>
          <td>
            <button class="btn btn-warning btn-sm" (click)="openEditModal(producto)">✏️</button>
            <button class="btn btn-danger btn-sm" (click)="deleteProducto(producto.id_producto)">🗑️</button>
          </td>
        </tr>

        <tr *ngIf="productosFiltrados.length === 0">
          <td colspan="6" class="text-center text-muted">No se encontraron productos</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- 🪟 Modal -->
  <div class="modal fade show d-block" *ngIf="showModal" tabindex="-1" style="background-color: rgba(0,0,0,0.5);">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content p-4">
        <h3>{{ isEditMode ? 'Editar Producto' : 'Nuevo Producto' }}</h3>

        <!-- ✅ Formulario -->
        <form [formGroup]="productoForm" (ngSubmit)="saveProducto()">
          <div class="form-group">
            <label for="titulo">Título</label>
            <input id="titulo" type="text" formControlName="titulo" class="form-control" required />
          </div>

          <div class="form-group">
            <label for="autor">Autor</label>
            <input id="autor" type="text" formControlName="autor" class="form-control" required />
          </div>

          <div class="form-group">
            <label for="anio">Año</label>
            <input id="anio" type="number" formControlName="anio" class="form-control" required />
          </div>

          <div class="form-check mt-2">
            <input id="disponible" type="checkbox" class="form-check-input" formControlName="disponible" />
            <label for="disponible" class="form-check-label">Disponible</label>
          </div>

          <!-- Solo al crear -->
          <div class="form-group mt-3" *ngIf="!isEditMode">
            <label for="id_usuario_crea">ID Usuario Creador</label>
            <input id="id_usuario_crea" type="text" formControlName="id_usuario_crea" class="form-control" required />
          </div>

          <!-- Botones -->
          <div class="mt-3 d-flex justify-content-end gap-2">
            <button type="submit" class="btn btn-primary">
              {{ isEditMode ? 'Actualizar' : 'Guardar' }}
            </button>
            <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancelar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
