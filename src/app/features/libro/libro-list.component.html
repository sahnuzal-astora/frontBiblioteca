<div class="Libro-list">
  <div class="card">
    <div class="card-header">
      <h2>Gestión de Libros</h2>
      <button class="btn btn-success" (click)="openCreateModal()">➕ Nuevo Libro</button>
    </div>

    <div class="filters">
      <input
        type="text"
        placeholder="Buscar por ID"
        [(ngModel)]="filtroIdLibro"
        (input)="filtrarLibros()"
      />
      <input
        type="text"
        placeholder="Buscar por título"
        [(ngModel)]="filtroTitulo"
        (input)="filtrarLibros()"
      />
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Título</th>
          <th>genero</th>
          <th>paginas</th>
          
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let Libro of LibrosFiltrados">
          <td>{{ Libro.idLibro }}</td>
          <td>{{ Libro.titulo }}</td>
          <td>{{ Libro.genero }}</td>
          <td>{{ Libro.paginas }}</td>
          
          <td>
            <button class="btn btn-warning btn-sm" (click)="openEditModal(Libro)">✏️</button>
            <button class="btn btn-danger btn-sm" (click)="deleteLibro(Libro.idLibro)">🗑️</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" *ngIf="showModal">
    <div class="modal-content animate">
      <h3>{{ isEditMode ? 'Editar Libro' : 'Nuevo Libro' }}</h3>
      <form (ngSubmit)="saveLibro()">
        <div class="form-group">
          <label for="titulo">Título</label>
          <input id="titulo" name="titulo" type="text" [(ngModel)]="LibroForm.titulo" required />
        </div>

        <div class="form-group">
          <label for="genero">genero</label>
          <input id="genero" name="genero" type="text" [(ngModel)]="LibroForm.genero" required />
        </div>

        <div class="form-group">
          <label for="paginas">paginas</label>
          <input id="paginas" name="paginas" type="text" [(ngModel)]="LibroForm.paginas" required />
        </div>

        

        <div class="actions">
          <button type="submit" class="btn btn-primary">{{ isEditMode ? 'Actualizar' : 'Guardar' }}</button>
          <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>
