<div class="tesis-list">

  <div class="card">
    <div class="card-header">
      <h2>Gestión de Tesis</h2>
      <button class="btn btn-success" (click)="openCreateModal()">➕ Nueva Tesis</button>
    </div>

    
    <div class="filters">
      <input
        type="text"
        placeholder="Buscar por ID o Universidad"
        [(ngModel)]="filtroBusqueda"
        (input)="onFilterChange()"
      />
    </div>

    
    <table class="table">
      <thead>
        <tr>
          <th>ID Tesis</th>
          <th>Universidad</th>
          <th>Director</th>
          <th>Grado Académico</th>
          <th>ID Producto</th>
          <th>Acciones</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let t of tesisFiltradas">
          <td>{{ t.id_tesis }}</td>
          <td>{{ t.universidad }}</td>
          <td>{{ t.director || 'N/A' }}</td>
          <td>{{ t.grado_academico }}</td>
          <td>{{ t.producto_id }}</td>
          <td>
            <button class="btn btn-warning btn-sm" (click)="openEditModal(t)">✏️ Editar</button>
            <button class="btn btn-danger btn-sm" (click)="deleteTesis(t.id_tesis)">🗑️ Borrar</button>
          </td>
        </tr>
      </tbody>
    </table>

    
    <p *ngIf="tesisFiltradas.length === 0" class="no-results">
      No se encontraron tesis registradas.
    </p>
  </div>

  
  <div class="modal-backdrop" *ngIf="showModal">
    <div class="modal-content animate">

      <h3>{{ isEditMode ? 'Editar Tesis' : 'Nueva Tesis' }}</h3>

      <form [formGroup]="tesisForm" (ngSubmit)="saveTesis()">

        <div class="form-group">
          <label for="universidad">Universidad</label>
          <input
            id="universidad"
            type="text"
            formControlName="universidad"
            required
          />
        </div>

        <div class="form-group">
          <label for="director">Director</label>
          <input
            id="director"
            type="text"
            formControlName="director"
            required
          />
        </div>

        <div class="form-group">
          <label for="grado_academico">Grado Académico</label>
          <input
            id="grado_academico"
            type="text"
            formControlName="grado_academico"
            required
          />
        </div>

        
        <div class="form-group" *ngIf="!isEditMode">
          <label for="producto_id">ID Producto</label>
          <input
            id="producto_id"
            type="text"
            formControlName="producto_id"
            required
          />
        </div>

        
        <div class="form-group" *ngIf="!isEditMode">
          <label for="id_usuario_crea">Usuario Crea (UUID)</label>
          <input
            id="id_usuario_crea"
            type="text"
            formControlName="id_usuario_crea"
            required
          />
        </div>

        
        <div class="form-group" *ngIf="isEditMode">
          <label for="id_usuario_edita">Usuario Edita (UUID)</label>
          <input
            id="id_usuario_edita"
            type="text"
            formControlName="id_usuario_edita"
            required
          />
        </div>

        <div class="actions">
          <button type="submit" class="btn btn-primary">
            {{ isEditMode ? 'Actualizar' : 'Guardar' }}
          </button>

          <button type="button" class="btn btn-secondary" (click)="closeModal()">
            Cancelar
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
