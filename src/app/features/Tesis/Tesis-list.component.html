<div class="tesis-list">
  <div class="card">
    <div class="card-header">
      <h2>Gestión de Tesis</h2>
      <button class="btn btn-success" (click)="openCreateModal()">➕ Nueva Tesis</button>
    </div>

    <div class="filters">
      <input
        type="text"
        placeholder="Buscar por ID"
        [(ngModel)]="filtroIdTesis"
        (input)="filtrarTesis()"
      />
      <input
        type="text"
        placeholder="Buscar por Universidad"
        [(ngModel)]="filtroUniversidad"
        (input)="filtrarTesis()"
      />
      <input
        type="text"
        placeholder="Buscar por Director"
        [(ngModel)]="filtroDirector"
        (input)="filtrarTesis()"
      />
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Universidad</th>
          <th>Director</th>
          <th>Grado Académico</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let tesis of TesisFiltradas">
          <td>{{ tesis.idTesis }}</td>
          <td>{{ tesis.universidad }}</td>
          <td>{{ tesis.director }}</td>
          <td>{{ tesis.gradoAcademico }}</td>
          <td>
            <button class="btn btn-warning btn-sm" (click)="openEditModal(tesis)">✏️</button>
            <button class="btn btn-danger btn-sm" (click)="deleteTesis(tesis.idTesis)">🗑️</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" *ngIf="showModal">
    <div class="modal-content animate">
      <h3>{{ isEditMode ? 'Editar Tesis' : 'Nueva Tesis' }}</h3>
      <form (ngSubmit)="saveTesis()">
        
        <!-- 🆔 Campo ID -->
        <div class="form-group">
          <label for="idTesis">ID</label>
          <input
            id="idTesis"
            name="idTesis"
            type="number"
            [(ngModel)]="TesisForm.idTesis"
            [readonly]="isEditMode"
            required
          />
        </div>

        <div class="form-group">
          <label for="universidad">Universidad</label>
          <input
            id="universidad"
            name="universidad"
            type="text"
            [(ngModel)]="TesisForm.universidad"
            required
          />
        </div>

        <div class="form-group">
          <label for="director">Director</label>
          <input
            id="director"
            name="director"
            type="text"
            [(ngModel)]="TesisForm.director"
            required
          />
        </div>

        <div class="form-group">
          <label for="gradoAcademico">Grado Académico</label>
          <select
            id="gradoAcademico"
            name="gradoAcademico"
            [(ngModel)]="TesisForm.gradoAcademico"
            required
          >
            <option value="Licenciatura">Licenciatura</option>
            <option value="Maestría">Maestría</option>
            <option value="Doctorado">Doctorado</option>
          </select>
        </div>

        <div class="actions">
          <button type="submit" class="btn btn-primary">
            {{ isEditMode ? 'Actualizar' : 'Guardar' }}
          </button>
          <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>
